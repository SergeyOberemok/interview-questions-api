services:
  nginx:
    image: nginx:alpine
    container_name: interview-questions-nginx
    restart: unless-stopped
    ports:
      - '${EXT_PORT}:443'
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - app
      - tuition

  app:
    build:
      context: ..
      dockerfile: ./interview-questions-api/Dockerfile
    image: interview-questions-api
    container_name: interview-questions-api
    restart: unless-stopped
    environment:
      NODE_ENV: prod
      DATABASE_URI: ${DATABASE_URI:?DATABASE_URI is required}
    volumes:
      - ./public:/usr/src/app/public

  tuition:
    build:
      context: ..
      dockerfile: ./interview-tuition-api/Dockerfile
    image: interview-tuition-api
    container_name: interview-tuition-api
    restart: unless-stopped
    environment:
      DB_URI: ${TUITION_DATABASE_URI:?TUITION_DATABASE_URI is required}
